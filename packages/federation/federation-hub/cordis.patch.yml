# Federation Hub Profile Bundle: mounts the central federation control-plane
# service plus the session-source seam it uses to answer pod session reads.
- insert:
    - id: session-sources
      name: '@deepseek-ai/dsh-session-source'
    - id: session-source-local
      name: '@deepseek-ai/dsh-session-source-local'
    - id: federation-hub
      name: '@deepseek-ai/dsh-federation-hub'
      config:
        port: !!js process.env.DSH_FEDERATION_PORT ? Number(process.env.DSH_FEDERATION_PORT) : 3080
        host: !!js process.env.DSH_FEDERATION_HOST || '127.0.0.1'
        token: !!js process.env.DSH_FEDERATION_TOKEN
